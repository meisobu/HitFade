
name: Build HitFade

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Xmx3G

      - uses: actions/upload-artifact@v4
        with:
          name: HitFade-mod
          path: build/libs/*.jar
